<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<title>Login</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    background:linear-gradient(135deg,#0d6efd,#4facfe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.container{
    width:900px;
    height:500px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    box-shadow:0px 10px 25px rgba(0,0,0,.3);
}
.left{
    width:45%;
    background:#0d6efd;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}
.left h1{
    font-size:35px;
    margin-bottom:20px;
}
.left p{
    font-size:18px;
    text-align:center;
    line-height:30px;
}
.right{
    width:55%;
    padding:60px;
}
.right h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:35px;
}
.input-group{
    margin-bottom:25px;
}
label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}
input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}
input:focus{
    outline:none;
    border:2px solid #0d6efd;
}
button{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    background:#084298;
}
.bottom{
    margin-top:25px;
    text-align:center;
}
.bottom a{
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
}
.bottom a:hover{
    text-decoration:underline;
}
.home{
    text-align:center;
    margin-top:15px;
}
.home a{
    text-decoration:none;
    color:#666;
}
</style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>Resume Builder</h1>
            <p>
            Welcome back!
            Login to manage resumes, search candidates,
            and update professional profiles through your dashboard.
            </p>
        </div>
        <div class="right">
            <h2>User Login</h2>
            <div class="input-group">
            <label>Email Address</label>
            <input
            type="email"
            id="loginEmail"
            placeholder="Enter Email">
            </div>
            <div class="input-group">
            <label>Password</label>
            <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password">
            </div>
            <button onclick="login()">Login</button>
        <div class="bottom">
        Don't have an account?
        <a href="register.html">
        Register
        </a>
        </div>
        <div class="home">
        <a href="index.html">← Back to Home</a>
        </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
