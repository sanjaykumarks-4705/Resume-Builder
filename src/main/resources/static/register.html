<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<title>User Registration</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    background:linear-gradient(135deg,#0d6efd,#4facfe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.container{
    width:900px;
    height:550px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    box-shadow:0px 10px 25px rgba(0,0,0,.3);
}
.left{
    width:45%;
    background:#0d6efd;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}
.left h1{
    font-size:35px;
    margin-bottom:20px;
}
.left p{
    text-align:center;
    line-height:28px;
    font-size:18px;
}
.right{
    width:55%;
    padding:50px;
}
.right h2{
    color:#0d6efd;
    margin-bottom:30px;
    text-align:center;
}
.input-group{
    margin-bottom:20px;
}
label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}
input:focus{
    outline:none;
    border:2px solid #0d6efd;
}
button{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    background:#084298;
}
.bottom{
    text-align:center;
    margin-top:25px;
}
.bottom a{
    color:#0d6efd;
    text-decoration:none;
    font-weight:bold;
}
.bottom a:hover{
    text-decoration:underline;
}
.home{
    text-align:center;
    margin-top:15px;
}
.home a{
    color:#555;
    text-decoration:none;
}
</style>
</head>
<body>
    <div class="container">
        <div class="left">
        <h1>Resume Builder</h1>
        <p>
        Create your account and start building
        professional resumes in minutes.
        Manage resumes efficiently using
        our Resume Builder Dashboard.
        </p>
        </div>
        <div class="right">
        <h2>Create Account</h2>
        <div class="input-group">
        <label>Full Name</label>
        <input
        type="text"
        id="name"
        placeholder="Enter Full Name">
        </div>
        <div class="input-group">
        <label>Email Address</label>
        <input
        type="email"
        id="email"
        placeholder="Enter Email">
        </div>
        <div class="input-group">
        <label>Password</label>
        <input
        type="password"
        id="password"
        placeholder="Enter Password">
        </div>
        <button onclick="register()">Register</button>
        <div class="bottom">
        Already have an account?
        <a href="login.html">
        Login
        </a>
        </div>
        <div class="home">
        <a href="index.html">← Back to Home</a>
        </div>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
